[package]
name = "mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Headless MCP server for g-ssh saved hosts, exec, and local forwards"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
async-channel = "2.5"
core = { path = "../core" }
rmcp = { version = "3.11", features = ["server", "transport-io"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

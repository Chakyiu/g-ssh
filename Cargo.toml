[package]
name = "g-ssh"
version = "0.3.4"
edition = "2021"
description = "SSH, SFTP and Telnet client"
license = "MIT"
authors = ["chakyiu"]
repository = "https://github.com/Chakyiu/g-ssh"
rust-version = "1.98"
publish = false

[package.metadata.bundle]
name = "g-ssh"
identifier = "app.g-ssh"
icon = ["assets/app-icon/g-ssh.icns"]
category = "public.app-category.developer-tools"

[package.metadata.bundle.osx]
minimum_system_version = "12.0"

[dependencies]
# SSH, terminal emulator, vault and sync. Imported as `gssh`.
core = { path = "core" }

gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = [
    "font-kit",
    "x11",
    "wayland",
    "runtime_shaders",
] }
gpui-component = "=0.8.1"
gpui-kit-assets = "=0.8.1"

rust-embed = { version = "8", features = ["include-exclude"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
russh = "0.65"
rfd = "0.17"
notify = "=8.2.1"
tokio = { version = "1", features = [
    "rt",
    "macros",
    "fs",
    "io-util",
    "net",
    "sync",
    "time",
] }
base64 = "0.23"
async-channel = "2"
futures = "0.3"
gif = "0.14"

secrecy = "0.10"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

ureq = { version = "3", features = ["json"] }
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Touch ID unlock: the vault key in the keychain, behind the enrolled fingers.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSString",
] }
objc2-local-authentication = { version = "0.3", default-features = false, features = [
    "std",
    "LAContext",
] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }
winreg = "0.56"
# Termius local import (Windows only): NaCl secretbox field decryption and
# Snappy blocks in the IndexedDB LevelDB tables.
crypto_secretbox = "0.1"
snap = "1"
# The updater unpacks the release zip itself. Windows tar.exe calls the ANSI
# chdir, which fails when the install folder is outside the active code page
# (`could not chdir to '...\??\...'`). deflate-flate2 leaves the backend
# unset; rust_backend is miniz_oxide, already used elsewhere in the build.
zip = { version = "9.2", default-features = false, features = [
    "deflate-flate2",
] }
flate2 = { version = "1.1", default-features = false, features = [
    "rust_backend",
] }

[dev-dependencies]
tempfile = "3"
# The Windows updater's zip reader, so its tests run on every platform.
zip = { version = "9.2", default-features = false, features = [
    "deflate-flate2",
] }
flate2 = { version = "1.1", default-features = false, features = [
    "rust_backend",
] }

[workspace]
members = [".", "core", "updater"]

# Style lints that the UI code trips on purpose: gpui handlers take many
# arguments, and events carry whole entries.
[workspace.lints.clippy]
too_many_arguments = "allow"
large_enum_variant = "allow"
type_complexity = "allow"

[lints]
workspace = true

# build.rs uses these to make the .ico and put it into the .exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
ico = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }

# gpui, alacritty, argon2, and russh are too slow to use unoptimized, even in a debug build.
[profile.dev.package."*"]
opt-level = 3

# Symbols are stripped, so a panic backtrace in a release build has no function names.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

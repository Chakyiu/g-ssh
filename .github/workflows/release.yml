# Builds g-ssh for Linux, macOS arm64, and Windows x86_64.
# Each job runs on a machine of that architecture, because gpui links the
# platform's own graphics and window libraries and does not cross-compile.
#
# Runs when a version tag is pushed (`v0.1.5`), and can still be started by hand:
#   git tag v0.1.5 && git push origin v0.1.5
#   gh workflow run release.yml
# A tag publishes the archives on that GitHub release. The app downloads them
# from the release page. A hand start only keeps the archives as artifacts.
# The macOS binaries are not signed or notarized.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Matches the bundle's minimum_system_version. A build made on a newer
  # Mac would otherwise refuse to launch on macOS 12.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact: linux-aarch64
          # macos-14 retires 2026-11-02. macos-15 is still arm64, and the
          # deployment target above keeps the binary launchable on macOS 12.
          - runner: macos-15
            artifact: macos-aarch64
          - runner: windows-latest
            artifact: windows-x86_64
    steps:
      # `core` is in this repo. Cargo.toml depends on it by path.
      - uses: actions/checkout@v7

      # Wayland, X11, Vulkan, and fontconfig. gpui links these on Linux.
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc g++ clang pkg-config cmake \
            libfontconfig1-dev libfreetype6-dev \
            libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libssl-dev \
            libvulkan-dev

      # With no arguments rustup installs the compiler pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          shared-key: ${{ matrix.artifact }}

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          name="g-ssh-${version}-${{ matrix.artifact }}"
          mkdir "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/g-ssh.exe "$name/"
          else
            cp target/release/g-ssh "$name/"
          fi
          cp assets/fonts/CascadiaCode-LICENSE.txt \
            assets/fonts/SourceSans3-OFL.txt \
            assets/icons/LUCIDE-LICENSE.txt \
            "$name/"
          # The updater looks for this name on the release page:
          # g-ssh-<version>-<os-arch>.tar.gz, or .zip on Windows.
          if [ "${{ runner.os }}" = "Windows" ]; then
            archive="${name}.zip"
            tar -a -cf "$archive" "$name"
          else
            archive="${name}.tar.gz"
            tar -czf "$archive" "$name"
          fi
          echo "archive=$archive" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Attach archives to the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release archives were built" >&2
            exit 1
          fi
          # This job only downloads artifacts, so there is no checkout. Without
          # --repo, gh tries to read the repository from .git and exits with
          # "fatal: not a git repository". --repo also skips the local tag
          # lookup; --verify-tag still checks the tag on GitHub.
          repo="$GITHUB_REPOSITORY"
          if gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$repo" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$repo" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
